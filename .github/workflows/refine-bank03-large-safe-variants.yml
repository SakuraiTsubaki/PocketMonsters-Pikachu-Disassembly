name: Refine Bank 03 safe large source variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-bank03-large-safe-variants.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Refine six safety-cleared substantive modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json

          target = Path('target')
          safety = json.loads((target / 'config/bank03_large_variant_safety.json').read_text(encoding='utf-8'))
          selected = [m['path'] for m in safety['modules'] if m['safe_for_automatic_line_merge']]
          expected = {
              'engine/overworld/player_state.asm',
              'engine/events/poison.asm',
              'engine/items/item_effects.asm',
              'engine/overworld/cut.asm',
              'engine/pokemon/add_mon.asm',
              'engine/gfx/hp_bar.asm',
          }
          if set(selected) != expected:
              raise SystemExit(f'unexpected safety-cleared module set: {selected}')

          manifest_path = target / 'config/bank03_merged_source_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          records = {m['path']: m for m in manifest['modules']}

          def sha1(data: bytes) -> str:
              return hashlib.sha1(data).hexdigest()

          def blob_sha1(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          batch = []
          for rel in selected:
              jp_bytes = (Path('jp') / rel).read_bytes()
              intl_bytes = (Path('intl') / rel).read_bytes()
              record = records[rel]
              if record.get('strategy') != 'family-whole-file-conditional':
                  raise SystemExit(f'expected whole-family source before refinement: {rel}')
              if sha1(jp_bytes) != record['japanese_raw_sha1']:
                  raise SystemExit(f'Japanese pinned source SHA mismatch: {rel}')
              if sha1(intl_bytes) != record['international_raw_sha1']:
                  raise SystemExit(f'International pinned source SHA mismatch: {rel}')

              jp_lines = jp_bytes.decode('utf-8').splitlines(keepends=True)
              intl_lines = intl_bytes.decode('utf-8').splitlines(keepends=True)
              matcher = difflib.SequenceMatcher(a=intl_lines, b=jp_lines, autojunk=False)
              out = [
                  '; Bank 03 fine-grained family reconstruction.\n',
                  '; Common source lines are emitted once; only source-family differences are conditional.\n',
                  '; JP: Narishma-gb/pokeyellow-jp @ f282e72ae26232790fdb780aa5a5db7ec8ebf572\n',
                  '; INT: pret/pokeyellow @ e89ead154b9968aa50eed9328ff2b38b6c194382\n\n',
              ]
              selector_count = 0
              opcode_summary = []
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      out.extend(intl_lines[i1:i2])
                      continue
                  selector_count += 1
                  opcode_summary.append({
                      'tag': tag,
                      'international': [i1 + 1, i2],
                      'japanese': [j1 + 1, j2],
                  })
                  out.append('IF DEF(_JAPAN)\n')
                  out.extend(jp_lines[j1:j2])
                  out.append('ELSE\n')
                  out.extend(intl_lines[i1:i2])
                  out.append('ENDC\n')

              merged = ''.join(out).encode('utf-8')
              (target / rel).write_bytes(merged)
              record.update({
                  'strategy': 'fine-grained-family-conditional',
                  'selector': 'localized IF DEF(_JAPAN) / ELSE / ENDC line-opcode blocks',
                  'selector_count': selector_count,
                  'merged_raw_sha1': sha1(merged),
                  'merged_git_blob_sha1': blob_sha1(merged),
                  'merged_length': len(merged),
                  'branch_source_reconstruction_verified': True,
                  'automatic_merge_safety_verified': True,
              })
              batch.append({
                  'path': rel,
                  'selector_count': selector_count,
                  'international_raw_sha1': sha1(intl_bytes),
                  'japanese_raw_sha1': sha1(jp_bytes),
                  'merged_raw_sha1': sha1(merged),
                  'opcodes': opcode_summary,
              })

          manifest['fine_grained_module_count'] = sum(1 for m in manifest['modules'] if m.get('strategy') == 'fine-grained-family-conditional')
          manifest['whole_family_module_count'] = sum(1 for m in manifest['modules'] if m.get('strategy') == 'family-whole-file-conditional')
          manifest['status'] = 'fine-grained-source-populated-except-manual-joypad' if manifest['whole_family_module_count'] == 1 else manifest['status']
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          batch_manifest = {
              'schema_version': 1,
              'bank': '03',
              'batch': 'large-safe-substantive-2',
              'module_count': len(batch),
              'strategy': 'safety-cleared line-level SequenceMatcher opcodes',
              'source_reconstruction_complete': False,
              'byte_perfect_rebuild_claim': False,
              'modules': batch,
          }
          (target / 'config/bank03_fine_merge_batch2.json').write_text(json.dumps(batch_manifest, indent=2) + '\n', encoding='utf-8')
          print(f'refined {len(batch)} safe large modules; fine={manifest["fine_grained_module_count"]}, whole={manifest["whole_family_module_count"]}')
          PY

      - name: Validate Bank 03 source ledger
        working-directory: target
        run: |
          python3 tools/check_bank03_sources.py
          make bank03-check

      - name: Commit refined sources
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            engine/overworld/player_state.asm \
            engine/events/poison.asm \
            engine/items/item_effects.asm \
            engine/overworld/cut.asm \
            engine/pokemon/add_mon.asm \
            engine/gfx/hp_bar.asm \
            config/bank03_merged_source_manifest.json \
            config/bank03_fine_merge_batch2.json
          git commit -m 'bank03: refine six safety-cleared large variants'
          git push origin HEAD:main
