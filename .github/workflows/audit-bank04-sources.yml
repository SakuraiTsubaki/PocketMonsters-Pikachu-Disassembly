name: Audit Bank 04 source families

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-bank04-sources.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Classify and import safe Bank 04 sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json
          import re
          import shutil

          target = Path('target')
          bank = json.loads((target / 'config/bank04_modules.json').read_text(encoding='utf-8'))
          layout = bank['layout_crosscheck']
          intl_sections = layout['international_reference']['sections']
          jp_sections = layout['japanese_reference']['sections']
          intl_bank_paths = intl_sections['bank4'] + intl_sections['Battle Engine 1']
          jp_bank_paths = jp_sections['bank4'] + jp_sections['Battle Engine 1']
          all_paths = list(dict.fromkeys(intl_bank_paths + jp_bank_paths))
          if len(all_paths) != 14:
              raise SystemExit(f'expected 14 unique Bank 04 source paths, got {len(all_paths)}')

          common_bank = set(intl_bank_paths) & set(jp_bank_paths)
          jp_extra = set(jp_bank_paths) - set(intl_bank_paths)
          if len(common_bank) != 11 or len(jp_extra) != 3:
              raise SystemExit(f'unexpected family placement split: common={len(common_bank)} jp-extra={len(jp_extra)}')

          def raw_sha(data: bytes) -> str:
              return hashlib.sha1(data).hexdigest()

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          def strip_comment(line: str) -> str:
              out = []
              quote = None
              escaped = False
              for ch in line:
                  if escaped:
                      out.append(ch); escaped = False; continue
                  if ch == '\\':
                      out.append(ch); escaped = True; continue
                  if quote:
                      out.append(ch)
                      if ch == quote: quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch; out.append(ch); continue
                  if ch == ';': break
                  out.append(ch)
              return ''.join(out)

          def tokens(text: str):
              clean = '\n'.join(strip_comment(line) for line in text.splitlines())
              return re.findall(r'\$[0-9A-Fa-f]+|%[01]+|[A-Za-z_][A-Za-z0-9_@.#?]*|\d+|"(?:\\.|[^"\\])*"|\S', clean)

          counts = {
              'exact_shared': 0,
              'cosmetic_only': 0,
              'substantive': 0,
              'safe_imported': 0,
              'already_present_identical': 0,
          }
          records = []
          diff_root = target / 'analysis/bank04/source_diffs'
          diff_root.mkdir(parents=True, exist_ok=True)

          for rel in all_paths:
              intl_path = Path('intl') / rel
              jp_path = Path('jp') / rel
              if not intl_path.is_file() or not jp_path.is_file():
                  raise SystemExit(f'missing pinned source in one family: {rel}')
              intl_data = intl_path.read_bytes()
              jp_data = jp_path.read_bytes()
              intl_text = intl_data.decode('utf-8')
              jp_text = jp_data.decode('utf-8')

              if intl_data == jp_data:
                  classification = 'exact-shared'
                  counts['exact_shared'] += 1
              elif tokens(intl_text) == tokens(jp_text):
                  classification = 'cosmetic-only'
                  counts['cosmetic_only'] += 1
              else:
                  classification = 'substantive'
                  counts['substantive'] += 1

              dst = target / rel
              target_state = 'missing'
              if dst.exists():
                  existing = dst.read_bytes()
                  if existing == intl_data:
                      target_state = 'present-international'
                      counts['already_present_identical'] += 1
                  elif existing == jp_data:
                      target_state = 'present-japanese'
                  else:
                      target_state = 'present-other'
              elif classification in {'exact-shared', 'cosmetic-only'}:
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(intl_path, dst)
                  target_state = 'imported-international-common-source'
                  counts['safe_imported'] += 1

              diff_path = None
              if classification != 'exact-shared':
                  diff = ''.join(difflib.unified_diff(
                      intl_text.splitlines(keepends=True),
                      jp_text.splitlines(keepends=True),
                      fromfile=f'international/{rel}',
                      tofile=f'japanese/{rel}',
                      n=3,
                  ))
                  p = diff_root / (rel.replace('/', '__') + '.diff')
                  p.write_text(diff, encoding='utf-8')
                  diff_path = str(p.relative_to(target))

              records.append({
                  'path': rel,
                  'placement_class': 'common-bank04' if rel in common_bank else 'japanese-bank04-international-other-bank',
                  'international_bank04': rel in set(intl_bank_paths),
                  'japanese_bank04': rel in set(jp_bank_paths),
                  'classification': classification,
                  'international_raw_sha1': raw_sha(intl_data),
                  'japanese_raw_sha1': raw_sha(jp_data),
                  'international_git_blob_sha1': blob_sha(intl_data),
                  'japanese_git_blob_sha1': blob_sha(jp_data),
                  'international_lines': len(intl_text.splitlines()),
                  'japanese_lines': len(jp_text.splitlines()),
                  'target_state_after_audit': target_state,
                  'diff_path': diff_path,
              })

          inventory = {
              'schema_version': 1,
              'bank': '04',
              'status': 'source-families-audited-safe-common-imported',
              'source_reconstruction_complete': False,
              'byte_perfect_rebuild_claim': False,
              'references': {
                  'international': {'repository': 'pret/pokeyellow', 'commit': 'e89ead154b9968aa50eed9328ff2b38b6c194382'},
                  'japanese': {'repository': 'Narishma-gb/pokeyellow-jp', 'commit': 'f282e72ae26232790fdb780aa5a5db7ec8ebf572'},
              },
              'unique_source_path_count': len(all_paths),
              'common_bank04_path_count': len(common_bank),
              'japanese_bank04_international_other_bank_path_count': len(jp_extra),
              'counts': counts,
              'modules': records,
          }
          (target / 'config/bank04_source_inventory.json').write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(counts, indent=2))
          PY

      - name: Commit audit and safe source imports
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/bank04_source_inventory.json analysis/bank04 engine data gfx
          if git diff --cached --quiet; then
            echo 'No Bank 04 source audit changes to commit.'
            exit 0
          fi
          git commit -m 'bank04: audit source families and import shared modules'
          git push origin HEAD:main
