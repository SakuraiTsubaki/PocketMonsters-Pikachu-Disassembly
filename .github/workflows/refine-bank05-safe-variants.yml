name: Refine Bank 05 substantive source variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-bank05-safe-variants.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Analyze and merge safety-cleared substantive modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json
          import re

          target = Path('target')
          inventory = json.loads((target/'config/bank05_source_inventory.json').read_text(encoding='utf-8'))
          selected = [m for m in inventory['modules'] if m['classification'] == 'substantive']
          if len(selected) != 3:
              raise SystemExit(f'expected 3 substantive Bank 05 modules, got {len(selected)}')

          directive_re = re.compile(r'^\s*(IF|ELIF|ELSE|ENDC)\b')
          def directive(line):
              code=line.split(';',1)[0]
              m=directive_re.match(code)
              return m.group(1) if m else None
          def raw_sha(data): return hashlib.sha1(data).hexdigest()
          def blob_sha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii')+data).hexdigest()

          def balanced(lines):
              stack=[]; errors=[]
              for n,line in enumerate(lines,1):
                  d=directive(line)
                  if d=='IF': stack.append({'line':n,'else_seen':False})
                  elif d=='ELIF':
                      if not stack: errors.append(f'ELIF without IF at {n}')
                      elif stack[-1]['else_seen']: errors.append(f'ELIF after ELSE at {n}')
                  elif d=='ELSE':
                      if not stack: errors.append(f'ELSE without IF at {n}')
                      elif stack[-1]['else_seen']: errors.append(f'duplicate ELSE at {n}')
                      else: stack[-1]['else_seen']=True
                  elif d=='ENDC':
                      if not stack: errors.append(f'ENDC without IF at {n}')
                      else: stack.pop()
              if stack: errors.append(f'{len(stack)} unterminated IF block(s)')
              return not errors, errors

          safety_records=[]; merged_records=[]; safe_paths=[]; manual_paths=[]
          for rec in selected:
              rel=rec['path']
              ib=(Path('intl')/rel).read_bytes(); jb=(Path('jp')/rel).read_bytes()
              if raw_sha(ib)!=rec['international_raw_sha1'] or raw_sha(jb)!=rec['japanese_raw_sha1']:
                  raise SystemExit(f'provenance mismatch: {rel}')
              il=ib.decode('utf-8').splitlines(keepends=True)
              jl=jb.decode('utf-8').splitlines(keepends=True)
              matcher=difflib.SequenceMatcher(a=il,b=jl,autojunk=False)
              body=[]; touched=[]; opcodes=[]; selectors=0
              for tag,i1,i2,j1,j2 in matcher.get_opcodes():
                  if tag=='equal':
                      body.extend(il[i1:i2]); continue
                  selectors+=1
                  iseg=il[i1:i2]; jseg=jl[j1:j2]
                  hits=[{'family':'international','line':i1+k+1,'directive':directive(x),'text':x.rstrip('\n')} for k,x in enumerate(iseg) if directive(x)]
                  hits += [{'family':'japanese','line':j1+k+1,'directive':directive(x),'text':x.rstrip('\n')} for k,x in enumerate(jseg) if directive(x)]
                  touched.extend(hits)
                  opcodes.append({'tag':tag,'international':[i1+1,i2],'japanese':[j1+1,j2],'directive_hits':hits})
                  body.append('IF DEF(_JAPAN)\n'); body.extend(jseg); body.append('ELSE\n'); body.extend(iseg); body.append('ENDC\n')
              ok,errors=balanced(body)
              safe=ok and not touched
              safety_records.append({'path':rel,'selector_count':selectors,'changed_opcode_directive_hit_count':len(touched),'generated_conditionals_balanced':ok,'balance_errors':errors,'safe_for_automatic_line_merge':safe,'directive_hits':touched,'opcodes':opcodes})
              if not safe:
                  manual_paths.append(rel); continue
              out=[
                  '; Bank 05 fine-grained family reconstruction.\n',
                  '; Common source lines are emitted once; only source-family differences are conditional.\n',
                  '; JP: Narishma-gb/pokeyellow-jp @ f282e72ae26232790fdb780aa5a5db7ec8ebf572\n',
                  '; INT: pret/pokeyellow @ e89ead154b9968aa50eed9328ff2b38b6c194382\n\n',
              ]+body
              merged=''.join(out).encode('utf-8')
              dst=target/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(merged)
              safe_paths.append(rel)
              merged_records.append({'path':rel,'placement_class':rec['placement_class'],'strategy':'fine-grained-family-conditional','selector':'localized IF DEF(_JAPAN) / ELSE / ENDC line-opcode blocks','selector_count':selectors,'international_raw_sha1':rec['international_raw_sha1'],'japanese_raw_sha1':rec['japanese_raw_sha1'],'merged_raw_sha1':raw_sha(merged),'merged_git_blob_sha1':blob_sha(merged),'merged_length':len(merged),'automatic_merge_safety_verified':True,'branch_source_reconstruction_verified':True})

          safety={'schema_version':1,'bank':'05','rule':'Automatic fine-grained merge requires zero changed RGBDS conditional-directive hits and a balanced generated conditional stack.','substantive_module_count':3,'safe_count':len(safe_paths),'manual_count':len(manual_paths),'safe_paths':safe_paths,'manual_paths':manual_paths,'modules':safety_records}
          (target/'config/bank05_variant_safety.json').write_text(json.dumps(safety,indent=2)+'\n',encoding='utf-8')
          merged={'schema_version':1,'bank':'05','status':'all-safe-substantive-modules-fine-grained-source-populated' if not manual_paths else 'manual-substantive-modules-pending','source_reconstruction_complete':False,'byte_perfect_rebuild_claim':False,'safe_fine_grained_count':len(merged_records),'manual_pending_count':len(manual_paths),'manual_pending_paths':manual_paths,'modules':merged_records}
          (target/'config/bank05_merged_source_manifest.json').write_text(json.dumps(merged,indent=2)+'\n',encoding='utf-8')
          print(f'Bank 05 substantive safety: safe={len(safe_paths)} manual={len(manual_paths)}')
          for r in safety_records:
              print(r['path'], 'SAFE' if r['safe_for_automatic_line_merge'] else 'MANUAL', 'selectors=',r['selector_count'],'directive_hits=',r['changed_opcode_directive_hit_count'])
          PY

      - name: Commit safety report and safe merges
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/bank05_variant_safety.json config/bank05_merged_source_manifest.json engine
          git commit -m 'bank05: refine safety-cleared substantive variants'
          git push origin HEAD:main
