name: Refine Bank 03 small source variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-bank03-small-variants.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Refine seven small substantive modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json

          target = Path('target')
          selected = [
              'engine/events/hidden_events/elevator.asm',
              'engine/events/hidden_events/pokemon_stuff.asm',
              'engine/events/hidden_events/town_map.asm',
              'engine/overworld/clear_variables.asm',
              'engine/events/hidden_events/book_or_sculpture.asm',
              'engine/events/hidden_events/indigo_plateau_statues.asm',
              'engine/menus/draw_badges.asm',
          ]

          manifest_path = target / 'config/bank03_merged_source_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          records = {m['path']: m for m in manifest['modules']}

          def sha1(data: bytes) -> str:
              return hashlib.sha1(data).hexdigest()

          def blob_sha1(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          batch = []
          for rel in selected:
              jp_bytes = (Path('jp') / rel).read_bytes()
              intl_bytes = (Path('intl') / rel).read_bytes()
              record = records[rel]
              if sha1(jp_bytes) != record['japanese_raw_sha1']:
                  raise SystemExit(f'Japanese pinned source SHA mismatch: {rel}')
              if sha1(intl_bytes) != record['international_raw_sha1']:
                  raise SystemExit(f'International pinned source SHA mismatch: {rel}')

              jp_lines = jp_bytes.decode('utf-8').splitlines(keepends=True)
              intl_lines = intl_bytes.decode('utf-8').splitlines(keepends=True)
              matcher = difflib.SequenceMatcher(a=intl_lines, b=jp_lines, autojunk=False)

              out = [
                  '; Bank 03 fine-grained family reconstruction.\n',
                  '; Common source lines are emitted once; only source-family differences are conditional.\n',
                  '; JP: Narishma-gb/pokeyellow-jp @ f282e72ae26232790fdb780aa5a5db7ec8ebf572\n',
                  '; INT: pret/pokeyellow @ e89ead154b9968aa50eed9328ff2b38b6c194382\n\n',
              ]
              selector_count = 0
              opcode_summary = []
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      out.extend(intl_lines[i1:i2])
                      continue
                  selector_count += 1
                  opcode_summary.append({
                      'tag': tag,
                      'international': [i1 + 1, i2],
                      'japanese': [j1 + 1, j2],
                  })
                  out.append('IF DEF(_JAPAN)\n')
                  out.extend(jp_lines[j1:j2])
                  out.append('ELSE\n')
                  out.extend(intl_lines[i1:i2])
                  out.append('ENDC\n')

              if selector_count == 0:
                  raise SystemExit(f'expected source-family differences but found none: {rel}')

              merged = ''.join(out).encode('utf-8')
              (target / rel).write_bytes(merged)
              record.update({
                  'strategy': 'fine-grained-family-conditional',
                  'selector': 'localized IF DEF(_JAPAN) / ELSE / ENDC line-opcode blocks',
                  'selector_count': selector_count,
                  'merged_raw_sha1': sha1(merged),
                  'merged_git_blob_sha1': blob_sha1(merged),
                  'merged_length': len(merged),
                  'branch_source_reconstruction_verified': True,
              })
              batch.append({
                  'path': rel,
                  'selector_count': selector_count,
                  'international_raw_sha1': sha1(intl_bytes),
                  'japanese_raw_sha1': sha1(jp_bytes),
                  'merged_raw_sha1': sha1(merged),
                  'opcodes': opcode_summary,
              })

          manifest['status'] = 'mixed-fine-grained-and-family-conditional-source-populated'
          manifest['fine_grained_module_count'] = sum(
              1 for m in manifest['modules']
              if m.get('strategy') == 'fine-grained-family-conditional'
          )
          manifest['whole_family_module_count'] = sum(
              1 for m in manifest['modules']
              if m.get('strategy') == 'family-whole-file-conditional'
          )
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          batch_manifest = {
              'schema_version': 1,
              'bank': '03',
              'batch': 'small-substantive-1',
              'module_count': len(batch),
              'strategy': 'line-level SequenceMatcher opcodes; common lines emitted once; divergent line spans guarded by _JAPAN',
              'source_reconstruction_complete': False,
              'byte_perfect_rebuild_claim': False,
              'modules': batch,
          }
          (target / 'config/bank03_fine_merge_batch1.json').write_text(
              json.dumps(batch_manifest, indent=2) + '\n', encoding='utf-8'
          )
          print(f'refined {len(batch)} modules; fine={manifest["fine_grained_module_count"]}, whole={manifest["whole_family_module_count"]}')
          PY

      - name: Validate Bank 03 source ledger
        working-directory: target
        run: |
          python3 tools/check_bank03_sources.py
          make bank03-check

      - name: Commit refined sources
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            engine/events/hidden_events/elevator.asm \
            engine/events/hidden_events/pokemon_stuff.asm \
            engine/events/hidden_events/town_map.asm \
            engine/overworld/clear_variables.asm \
            engine/events/hidden_events/book_or_sculpture.asm \
            engine/events/hidden_events/indigo_plateau_statues.asm \
            engine/menus/draw_badges.asm \
            config/bank03_merged_source_manifest.json \
            config/bank03_fine_merge_batch1.json
          git commit -m 'bank03: refine seven small family variants'
          git push origin HEAD:main
