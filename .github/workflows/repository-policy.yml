name: Repository policy

on:
  push:
  pull_request:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate release manifest
        run: python -m json.tool config/releases.json > /dev/null

      - name: Enforce ROM-free repository policy
        run: make check-policy

      - name: Validate Bank 01 source reconstruction
        run: make bank01-check
