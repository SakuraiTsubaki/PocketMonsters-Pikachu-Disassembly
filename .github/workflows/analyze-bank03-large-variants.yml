name: Analyze Bank 03 large source variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-bank03-large-variants.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Analyze conditional-structure safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import json
          import re

          selected = [
              'engine/joypad.asm',
              'engine/overworld/player_state.asm',
              'engine/events/poison.asm',
              'engine/items/item_effects.asm',
              'engine/overworld/cut.asm',
              'engine/pokemon/add_mon.asm',
              'engine/gfx/hp_bar.asm',
          ]

          directive_re = re.compile(r'^\s*(IF|ELIF|ELSE|ENDC)\b')

          def directive(line: str):
              code = line.split(';', 1)[0]
              m = directive_re.match(code)
              return m.group(1) if m else None

          def build(intl_lines, jp_lines):
              matcher = difflib.SequenceMatcher(a=intl_lines, b=jp_lines, autojunk=False)
              out = []
              opcodes = []
              touched = []
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      out.extend(intl_lines[i1:i2])
                      continue
                  intl_seg = intl_lines[i1:i2]
                  jp_seg = jp_lines[j1:j2]
                  hits = [
                      {'family': 'international', 'line': i1 + k + 1, 'directive': directive(line), 'text': line.rstrip('\n')}
                      for k, line in enumerate(intl_seg) if directive(line)
                  ] + [
                      {'family': 'japanese', 'line': j1 + k + 1, 'directive': directive(line), 'text': line.rstrip('\n')}
                      for k, line in enumerate(jp_seg) if directive(line)
                  ]
                  if hits:
                      touched.extend(hits)
                  opcodes.append({
                      'tag': tag,
                      'international': [i1 + 1, i2],
                      'japanese': [j1 + 1, j2],
                      'directive_hits': hits,
                  })
                  out.append('IF DEF(_JAPAN)\n')
                  out.extend(jp_seg)
                  out.append('ELSE\n')
                  out.extend(intl_seg)
                  out.append('ENDC\n')
              return out, opcodes, touched

          def balanced(lines):
              stack = []
              errors = []
              for n, line in enumerate(lines, 1):
                  d = directive(line)
                  if d == 'IF':
                      stack.append({'line': n, 'else_seen': False})
                  elif d == 'ELIF':
                      if not stack:
                          errors.append(f'ELIF without IF at generated line {n}')
                      elif stack[-1]['else_seen']:
                          errors.append(f'ELIF after ELSE at generated line {n}')
                  elif d == 'ELSE':
                      if not stack:
                          errors.append(f'ELSE without IF at generated line {n}')
                      elif stack[-1]['else_seen']:
                          errors.append(f'duplicate ELSE at generated line {n}')
                      else:
                          stack[-1]['else_seen'] = True
                  elif d == 'ENDC':
                      if not stack:
                          errors.append(f'ENDC without IF at generated line {n}')
                      else:
                          stack.pop()
              if stack:
                  errors.append(f'{len(stack)} unterminated IF block(s)')
              return not errors, errors

          results = []
          for rel in selected:
              intl_lines = (Path('intl') / rel).read_text(encoding='utf-8').splitlines(keepends=True)
              jp_lines = (Path('jp') / rel).read_text(encoding='utf-8').splitlines(keepends=True)
              merged, opcodes, touched = build(intl_lines, jp_lines)
              is_balanced, errors = balanced(merged)
              results.append({
                  'path': rel,
                  'international_lines': len(intl_lines),
                  'japanese_lines': len(jp_lines),
                  'selector_count': len(opcodes),
                  'changed_opcode_directive_hit_count': len(touched),
                  'naive_generated_conditionals_balanced': is_balanced,
                  'balance_errors': errors,
                  'safe_for_automatic_line_merge': is_balanced and not touched,
                  'directive_hits': touched,
                  'opcodes': opcodes,
              })

          report = {
              'schema_version': 1,
              'bank': '03',
              'batch': 'large-substantive-safety',
              'rule': 'Automatic fine-grained merge is allowed only when no changed opcode contains RGBDS IF/ELIF/ELSE/ENDC directives and the generated conditional stack is balanced.',
              'safe_count': sum(r['safe_for_automatic_line_merge'] for r in results),
              'manual_count': sum(not r['safe_for_automatic_line_merge'] for r in results),
              'modules': results,
          }
          out = Path('target/config/bank03_large_variant_safety.json')
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(f"safe={report['safe_count']} manual={report['manual_count']}")
          for r in results:
              print(r['path'], 'SAFE' if r['safe_for_automatic_line_merge'] else 'MANUAL', 'selectors=', r['selector_count'], 'directive_hits=', r['changed_opcode_directive_hit_count'], 'balanced=', r['naive_generated_conditionals_balanced'])
          PY

      - name: Commit safety report
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/bank03_large_variant_safety.json
          git commit -m 'bank03: classify large variant merge safety'
          git push origin HEAD:main
