name: Import Bank 02 Music 1 sources

on:
  push:
    paths:
      - '.github/workflows/import-bank02-music.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: upstream

      - name: Import remaining Bank 02 Music 1 ASM sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            audio/music/indigo_plateau.asm
            audio/music/pallet_town.asm
            audio/music/unused_song.asm
            audio/music/cities_1.asm
            audio/sfx/get_item1.asm
            audio/music/museum_guy.asm
            audio/music/meet_prof_oak.asm
            audio/music/meet_rival.asm
            audio/sfx/pokedex_rating.asm
            audio/sfx/get_item2.asm
            audio/sfx/get_key_item.asm
            audio/music/ss_anne.asm
            audio/music/cities_2.asm
            audio/music/celadon.asm
            audio/music/cinnabar.asm
            audio/music/vermilion.asm
            audio/music/lavender.asm
            audio/music/safari_zone.asm
            audio/music/gym.asm
            audio/music/pokecenter.asm
          )

          for file in "${files[@]}"; do
            test -f "upstream/$file"
            mkdir -p "target/$(dirname "$file")"
            cp "upstream/$file" "target/$file"
            upstream_sha=$(git -C upstream hash-object "$file")
            target_sha=$(git -C target hash-object "$file")
            test "$upstream_sha" = "$target_sha"
            printf '%s  %s\n' "$target_sha" "$file"
          done

      - name: Commit imported sources
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audio/music/indigo_plateau.asm \
            audio/music/pallet_town.asm \
            audio/music/unused_song.asm \
            audio/music/cities_1.asm \
            audio/sfx/get_item1.asm \
            audio/music/museum_guy.asm \
            audio/music/meet_prof_oak.asm \
            audio/music/meet_rival.asm \
            audio/sfx/pokedex_rating.asm \
            audio/sfx/get_item2.asm \
            audio/sfx/get_key_item.asm \
            audio/music/ss_anne.asm \
            audio/music/cities_2.asm \
            audio/music/celadon.asm \
            audio/music/cinnabar.asm \
            audio/music/vermilion.asm \
            audio/music/lavender.asm \
            audio/music/safari_zone.asm \
            audio/music/gym.asm \
            audio/music/pokecenter.asm

          if git diff --cached --quiet; then
            echo 'No Music 1 source changes to commit.'
            exit 0
          fi

          git commit -m 'audio: import remaining Bank 02 Music 1 sources'
          git push origin HEAD:main
