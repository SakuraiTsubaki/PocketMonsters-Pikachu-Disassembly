name: Refine Bank 04 safe source variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-bank04-safe-variants.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Analyze and merge safety-cleared substantive modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json
          import re

          target = Path('target')
          inventory_path = target / 'config/bank04_source_inventory.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          selected = [m for m in inventory['modules'] if m['classification'] == 'substantive']
          if len(selected) != 9:
              raise SystemExit(f'expected 9 substantive Bank 04 modules, got {len(selected)}')

          directive_re = re.compile(r'^\s*(IF|ELIF|ELSE|ENDC)\b')

          def directive(line: str):
              code = line.split(';', 1)[0]
              m = directive_re.match(code)
              return m.group(1) if m else None

          def raw_sha(data: bytes) -> str:
              return hashlib.sha1(data).hexdigest()

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          def balanced(lines):
              stack = []
              errors = []
              for n, line in enumerate(lines, 1):
                  d = directive(line)
                  if d == 'IF':
                      stack.append({'line': n, 'else_seen': False})
                  elif d == 'ELIF':
                      if not stack:
                          errors.append(f'ELIF without IF at generated line {n}')
                      elif stack[-1]['else_seen']:
                          errors.append(f'ELIF after ELSE at generated line {n}')
                  elif d == 'ELSE':
                      if not stack:
                          errors.append(f'ELSE without IF at generated line {n}')
                      elif stack[-1]['else_seen']:
                          errors.append(f'duplicate ELSE at generated line {n}')
                      else:
                          stack[-1]['else_seen'] = True
                  elif d == 'ENDC':
                      if not stack:
                          errors.append(f'ENDC without IF at generated line {n}')
                      else:
                          stack.pop()
              if stack:
                  errors.append(f'{len(stack)} unterminated IF block(s)')
              return not errors, errors

          safety_records = []
          merged_records = []
          safe_paths = []
          manual_paths = []

          for rec in selected:
              rel = rec['path']
              intl_bytes = (Path('intl') / rel).read_bytes()
              jp_bytes = (Path('jp') / rel).read_bytes()
              if raw_sha(intl_bytes) != rec['international_raw_sha1']:
                  raise SystemExit(f'international provenance mismatch: {rel}')
              if raw_sha(jp_bytes) != rec['japanese_raw_sha1']:
                  raise SystemExit(f'Japanese provenance mismatch: {rel}')

              intl_lines = intl_bytes.decode('utf-8').splitlines(keepends=True)
              jp_lines = jp_bytes.decode('utf-8').splitlines(keepends=True)
              matcher = difflib.SequenceMatcher(a=intl_lines, b=jp_lines, autojunk=False)
              body = []
              touched = []
              opcodes = []
              selector_count = 0
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      body.extend(intl_lines[i1:i2])
                      continue
                  selector_count += 1
                  intl_seg = intl_lines[i1:i2]
                  jp_seg = jp_lines[j1:j2]
                  hits = [
                      {'family': 'international', 'line': i1 + k + 1, 'directive': directive(line), 'text': line.rstrip('\n')}
                      for k, line in enumerate(intl_seg) if directive(line)
                  ] + [
                      {'family': 'japanese', 'line': j1 + k + 1, 'directive': directive(line), 'text': line.rstrip('\n')}
                      for k, line in enumerate(jp_seg) if directive(line)
                  ]
                  touched.extend(hits)
                  opcodes.append({
                      'tag': tag,
                      'international': [i1 + 1, i2],
                      'japanese': [j1 + 1, j2],
                      'directive_hits': hits,
                  })
                  body.append('IF DEF(_JAPAN)\n')
                  body.extend(jp_seg)
                  body.append('ELSE\n')
                  body.extend(intl_seg)
                  body.append('ENDC\n')

              is_balanced, errors = balanced(body)
              safe = is_balanced and not touched
              safety_records.append({
                  'path': rel,
                  'placement_class': rec['placement_class'],
                  'selector_count': selector_count,
                  'changed_opcode_directive_hit_count': len(touched),
                  'generated_conditionals_balanced': is_balanced,
                  'balance_errors': errors,
                  'safe_for_automatic_line_merge': safe,
                  'directive_hits': touched,
                  'opcodes': opcodes,
              })

              if not safe:
                  manual_paths.append(rel)
                  continue

              out = [
                  '; Bank 04 fine-grained family reconstruction.\n',
                  '; Common source lines are emitted once; only source-family differences are conditional.\n',
                  '; JP: Narishma-gb/pokeyellow-jp @ f282e72ae26232790fdb780aa5a5db7ec8ebf572\n',
                  '; INT: pret/pokeyellow @ e89ead154b9968aa50eed9328ff2b38b6c194382\n\n',
              ] + body
              merged = ''.join(out).encode('utf-8')
              dst = target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(merged)
              safe_paths.append(rel)
              merged_records.append({
                  'path': rel,
                  'placement_class': rec['placement_class'],
                  'strategy': 'fine-grained-family-conditional',
                  'selector': 'localized IF DEF(_JAPAN) / ELSE / ENDC line-opcode blocks',
                  'selector_count': selector_count,
                  'international_raw_sha1': rec['international_raw_sha1'],
                  'japanese_raw_sha1': rec['japanese_raw_sha1'],
                  'merged_raw_sha1': raw_sha(merged),
                  'merged_git_blob_sha1': blob_sha(merged),
                  'merged_length': len(merged),
                  'automatic_merge_safety_verified': True,
                  'branch_source_reconstruction_verified': True,
              })

          safety = {
              'schema_version': 1,
              'bank': '04',
              'rule': 'Automatic fine-grained merge is allowed only when no changed opcode contains RGBDS IF/ELIF/ELSE/ENDC directives and the generated conditional stack is balanced.',
              'substantive_module_count': 9,
              'safe_count': len(safe_paths),
              'manual_count': len(manual_paths),
              'safe_paths': safe_paths,
              'manual_paths': manual_paths,
              'modules': safety_records,
          }
          (target / 'config/bank04_variant_safety.json').write_text(json.dumps(safety, indent=2) + '\n', encoding='utf-8')

          merged_manifest = {
              'schema_version': 1,
              'bank': '04',
              'status': 'safe-substantive-modules-fine-grained-manual-modules-pending',
              'source_reconstruction_complete': False,
              'byte_perfect_rebuild_claim': False,
              'safe_fine_grained_count': len(merged_records),
              'manual_pending_count': len(manual_paths),
              'manual_pending_paths': manual_paths,
              'modules': merged_records,
          }
          (target / 'config/bank04_merged_source_manifest.json').write_text(json.dumps(merged_manifest, indent=2) + '\n', encoding='utf-8')

          print(f'Bank 04 substantive safety: safe={len(safe_paths)} manual={len(manual_paths)}')
          for r in safety_records:
              state = 'SAFE' if r['safe_for_automatic_line_merge'] else 'MANUAL'
              print(r['path'], state, 'selectors=', r['selector_count'], 'directive_hits=', r['changed_opcode_directive_hit_count'])
          PY

      - name: Commit safety report and safe merges
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/bank04_variant_safety.json config/bank04_merged_source_manifest.json engine data gfx
          git commit -m 'bank04: refine safety-cleared substantive variants'
          git push origin HEAD:main
