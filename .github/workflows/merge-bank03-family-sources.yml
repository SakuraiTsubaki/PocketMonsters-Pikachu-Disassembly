name: Merge Bank 03 family source variants

on:
  push:
    paths:
      - '.github/workflows/merge-bank03-family-sources.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned international reference
        uses: actions/checkout@v4
        with:
          repository: pret/pokeyellow
          ref: e89ead154b9968aa50eed9328ff2b38b6c194382
          path: intl

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: jp

      - name: Create lossless family-conditional source files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          target = Path('target')
          analysis = json.loads((target / 'config/bank03_variant_analysis.json').read_text(encoding='utf-8'))
          modules = [m for m in analysis['modules'] if m['classification'] == 'substantive']
          if len(modules) != 14:
              raise SystemExit(f'expected 14 substantive Bank 03 modules, got {len(modules)}')

          def raw_sha(data: bytes) -> str:
              return hashlib.sha1(data).hexdigest()

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          records = []
          for module in modules:
              rel = module['path']
              dst = target / rel
              if dst.exists():
                  raise SystemExit(f'refusing to overwrite existing substantive target source: {rel}')

              intl = (Path('intl') / rel).read_bytes()
              jp = (Path('jp') / rel).read_bytes()
              if raw_sha(intl) != module['international_raw_sha1']:
                  raise SystemExit(f'pinned international source changed unexpectedly: {rel}')
              if raw_sha(jp) != module['japanese_raw_sha1']:
                  raise SystemExit(f'pinned Japanese source changed unexpectedly: {rel}')

              intl_text = intl.decode('utf-8')
              jp_text = jp.decode('utf-8')
              header = (
                  '; Bank 03 family-conditional reconstruction.\n'
                  '; Japanese source: Narishma-gb/pokeyellow-jp @ f282e72ae26232790fdb780aa5a5db7ec8ebf572\n'
                  '; International source: pret/pokeyellow @ e89ead154b9968aa50eed9328ff2b38b6c194382\n'
                  '; Whole-family branches are intentionally preserved losslessly until per-target byte validation allows finer deduplication.\n\n'
              )
              merged = (
                  header
                  + 'IF DEF(_JAPAN)\n\n'
                  + jp_text.rstrip('\n')
                  + '\n\nELSE\n\n'
                  + intl_text.rstrip('\n')
                  + '\n\nENDC\n'
              ).encode('utf-8')

              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(merged)
              records.append({
                  'path': rel,
                  'strategy': 'family-whole-file-conditional',
                  'selector': 'IF DEF(_JAPAN) / ELSE / ENDC',
                  'japanese_raw_sha1': raw_sha(jp),
                  'japanese_git_blob_sha1': blob_sha(jp),
                  'international_raw_sha1': raw_sha(intl),
                  'international_git_blob_sha1': blob_sha(intl),
                  'merged_raw_sha1': raw_sha(merged),
                  'merged_git_blob_sha1': blob_sha(merged),
                  'merged_length': len(merged),
              })

          manifest = {
              'schema_version': 1,
              'bank': '03',
              'status': 'family-conditional-source-populated',
              'source_reconstruction_complete': False,
              'byte_perfect_rebuild_claim': False,
              'strategy': 'Preserve pinned Japanese and international source bodies byte-for-byte inside a family conditional; refactor only after target builds can prove equivalence.',
              'references': analysis['references'],
              'module_count': len(records),
              'modules': records,
          }
          (target / 'config/bank03_merged_source_manifest.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          print(f'created {len(records)} family-conditional Bank 03 source files')
          PY

      - name: Commit merged source population
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/bank03_merged_source_manifest.json engine data
          if git diff --cached --quiet; then
            echo 'No Bank 03 merged source changes to commit.'
            exit 0
          fi
          git commit -m 'bank03: populate family-conditional source variants'
          git push origin HEAD:main
