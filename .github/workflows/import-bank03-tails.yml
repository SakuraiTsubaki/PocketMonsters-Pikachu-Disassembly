name: Import Bank 03 Japanese tails

on:
  push:
    paths:
      - '.github/workflows/import-bank03-tails.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target

      - name: Checkout pinned Japanese reference
        uses: actions/checkout@v4
        with:
          repository: Narishma-gb/pokeyellow-jp
          ref: f282e72ae26232790fdb780aa5a5db7ec8ebf572
          path: upstream

      - name: Reconstruct Bank 03 tails as editable ASM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          specs = [
              (
                  'rev_0', 'rev0a', 'JP Rev 0A', '0xFE30-0xFFFF', 464,
                  '79ac92a4cee3c1b9ed0d8a472aaa50dadf618085',
                  'd20b7466490d31a6b1203562c277fc3ba93f065c',
              ),
              (
                  'rev_1', 'revb', 'JP Rev B', '0xFE27-0xFFFF', 473,
                  '54ba5ff8ca15bd7930827b1f8ee1b358d70cb97d',
                  'c68d8247633afa84ce53c4a82a18bdd2df725787',
              ),
              (
                  'rev_2', 'revc', 'JP Rev C', '0xFE27-0xFFFF', 473,
                  '137053b3679654889b17fd5f0c42fd906fabc76b',
                  '1b8ccc4a797481fee0c25b9709d419357764bcee',
              ),
          ]

          def git_blob_sha1(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()

          for upstream_rev, target_rev, label, physical_range, expected_len, raw_sha1, blob_sha1 in specs:
              src = Path('upstream') / 'garbage' / upstream_rev / 'garbage_3.bin'
              data = src.read_bytes()
              assert len(data) == expected_len, (src, len(data), expected_len)
              actual_raw = hashlib.sha1(data).hexdigest()
              actual_blob = git_blob_sha1(data)
              assert actual_raw == raw_sha1, (src, actual_raw, raw_sha1)
              assert actual_blob == blob_sha1, (src, actual_blob, blob_sha1)

              dst = Path('target') / 'data' / 'garbage' / 'jp' / target_rev / 'bank03_tail.asm'
              dst.parent.mkdir(parents=True, exist_ok=True)
              lines = [
                  f'; Historical Bank 03 tail extracted from {label}.',
                  f'; Physical ROM range: {physical_range} ({expected_len} bytes)',
                  f'; Raw SHA-1: {raw_sha1}',
                  f'; Public reference Git blob SHA-1: {blob_sha1}',
                  '; Editable RGBDS source; no ROM binary is required by the repository build.',
                  '',
              ]
              for i in range(0, len(data), 16):
                  chunk = data[i:i+16]
                  lines.append('db ' + ', '.join(f'${byte:02x}' for byte in chunk))
              dst.write_text('\n'.join(lines) + '\n', encoding='utf-8')

              # Verify that parsing the emitted db source reproduces the original bytes.
              rebuilt = bytearray()
              for line in dst.read_text(encoding='utf-8').splitlines():
                  code = line.split(';', 1)[0].strip()
                  if not code.lower().startswith('db '):
                      continue
                  rebuilt.extend(int(token.strip()[1:], 16) for token in code[3:].split(','))
              assert bytes(rebuilt) == data
              print(f'{target_rev}: {expected_len} bytes raw={actual_raw} blob={actual_blob}')
          PY

      - name: Commit reconstructed ASM tails
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/garbage/jp/rev0a/bank03_tail.asm \
            data/garbage/jp/revb/bank03_tail.asm \
            data/garbage/jp/revc/bank03_tail.asm
          if git diff --cached --quiet; then
            echo 'No Bank 03 tail changes to commit.'
            exit 0
          fi
          git commit -m 'bank03: reconstruct Japanese Garbage 3 tails'
          git push origin HEAD:main
